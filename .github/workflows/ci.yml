name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test app
        working-directory: Apps/GogglesView
        env:
          GOGGLES_SKIP_SLOW_TESTS: "1"
        run: swift test
      - name: Test helper
        working-directory: Helper/GogglesHelper
        run: swift test
